# pr-checks.yml -- the security suite and the test suite on every pull request.
#
# Every gate in this repository was local: the pre-commit and pre-push hooks
# run only where someone installed them, `--no-verify` skips both, and a PR
# merged from the GitHub UI never passes through the maintainer's pre-push.
# This job is the one gate a contributor cannot skip, and the main-branch
# ruleset requires it.
#
# What it cannot do: the identity gate's deny-list and contributor allow-list
# are gitignored (committing them would publish what they protect), so here it
# runs the generic address rule over the tree only, and does not scan commit
# headers. The maintainer's local merge is still the check for names and for
# commit identities -- see .github/CONTRIBUTING.md.
#
# macOS on Apple Silicon because that is what the locks serve (the test venv
# installs only from requirements-dev.lock) and because the suite checks the
# scripts against Apple's /usr/bin/python3 3.9.

name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Scanner versions, held at the maintainer's. The two binaries are
      # checked against these hashes; the Python scanners are exact releases
      # but not hash-locked (they run only on this throwaway runner, never in
      # an install). Raise them deliberately, in a reviewed diff.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5"
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79"
      SEMGREP_VERSION: "1.157.0"
      BANDIT_VERSION: "1.9.4"
      PIP_AUDIT_VERSION: "2.10.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # gitleaks scans history, not just the tip
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install scanners
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | shasum -a 256 -c -
          tar -xzf gitleaks.tgz -C "$bin" gitleaks
          curl -fsSL -o shellcheck.txz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.darwin.aarch64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.txz" | shasum -a 256 -c -
          tar -xJf shellcheck.txz
          mv "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$bin/"
          # One venv per scanner, as pipx does: semgrep and pip-audit pin
          # conflicting dependencies and cannot share one.
          for spec in "semgrep==${SEMGREP_VERSION}" "bandit==${BANDIT_VERSION}" "pip-audit==${PIP_AUDIT_VERSION}"; do
            tool="${spec%%==*}"
            python -m venv "$RUNNER_TEMP/venv-$tool"
            "$RUNNER_TEMP/venv-$tool/bin/python" -m pip install --quiet --only-binary :all: "$spec"
            ln -s "$RUNNER_TEMP/venv-$tool/bin/$tool" "$bin/"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install the repository's hooks
        # The hooks pass checks the installed copies match installers/lib/hooks.
        run: ./installers/install-git-hooks.sh

      - name: Security suite (--full)
        # Artifacts stay on the runner. They are not uploaded: on a public
        # repo an uploaded artifact is public, and the identity-gate log
        # quotes the line it matched.
        env:
          SECURITY_ARTIFACTS_DIR: ${{ runner.temp }}/security-artifacts
        run: |
          set -uo pipefail
          installers/lib/security-checks.sh --full
          rc=$?
          summary="$(ls -d "$SECURITY_ARTIFACTS_DIR"/checks-*/ | tail -1)summary.txt"
          # A missing scanner is a named SKIP locally. Here every scanner was
          # installed above, so a SKIP in a static pass means one did not run.
          if grep -E '^  (sca|sast|shell|secrets|content|hooks) +SKIP' "$summary"; then
            echo "::error::a static pass was skipped on CI, where every scanner is installed"
            rc=1
          fi
          exit "$rc"

      - name: Test suite
        env:
          TEST_PYTHON: ${{ env.pythonLocation }}/bin/python3
        run: Templates/Scripts/tests/run_tests.sh --no-cov -q

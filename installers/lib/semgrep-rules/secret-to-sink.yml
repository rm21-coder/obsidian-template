# secret-to-sink.yml — a secret VALUE must not reach an output sink.
#
# Written 2026-08-25 after a CISO review flagged ten call sites as "printing
# sensitive data to log". All ten turned out to be safe — five print
# llm_endpoint.describe(), which returns a key NAME and a host and whose
# docstring says it never includes the value; two are generic log helpers that
# no caller feeds a secret; one prints a subcommand name; one writes to the
# 0600 plain-file backend rather than a log; and one is a deliberate operator
# CLI that already carries its own warning.
#
# The finding worth keeping was not any of those lines. It was that the
# standing suite could not express the question. Registry rules find secrets
# that are HARDCODED; nothing traced a secret value FLOWING into a print or a
# logger. A human reviewer could ask that; the suite could not.
#
# This closes that. Sources are the functions that return a real secret;
# sinks are the ways a value leaves the process as text. describe() is
# deliberately absent from the sources: it returns a name, which is the whole
# reason it exists.
rules:
  - id: secret-value-reaches-output-sink
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      A secret value reaches an output sink. Print the key NAME, not the
      value (see llm_endpoint.describe()). If this site is deliberate, add it
      to installers/lib/security-suppressions.txt with a rationale and a
      re-check date rather than leaving it unexplained.
    pattern-sources:
      - pattern: get_secret(...)
      - pattern: secret_store.get_secret(...)
      - pattern: $M._secret(...)
      - pattern: _secret(...)
      - pattern: getpass.getpass(...)
      - pattern: os.environ["ANTHROPIC_API_KEY"]
    pattern-sinks:
      - pattern: print(...)
      - pattern: $LOG.info(...)
      - pattern: $LOG.debug(...)
      - pattern: $LOG.warning(...)
      - pattern: $LOG.error(...)
      - pattern: $LOG.exception(...)
      - pattern: sys.stdout.write(...)
      - pattern: sys.stderr.write(...)
